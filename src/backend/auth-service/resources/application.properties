spring.application.name=auth-service
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/SGU_audio_guide
spring.datasource.username=sgu_app
spring.datasource.password=${SGU_DB_PASSWORD}
server.port=8081
server.servlet.session.cookie.name=SGU_ADMIN_SESSION

# Gmail SMTP - Admin password recovery
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SGU_MAIL_USERNAME}
spring.mail.password=${SGU_MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Secret key for password recovery OTP
sgu.password-reset.secret=${SGU_PASSWORD_RESET_SECRET}