spring.application.name=audio-server
server.port=8084
spring.datasource.url=${SGU_DB_URL:jdbc:mysql://127.0.0.1:3306/SGU_audio_guide}
spring.datasource.username=${SGU_DB_USER:sgu_app}
spring.datasource.password=${SGU_DB_PASSWORD}
services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
audio.storage.dir=${AUDIO_STORAGE_DIR:./data/uploads}
audio.public-base-url=${AUDIO_PUBLIC_BASE_URL:http://localhost:8084}
